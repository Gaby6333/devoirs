<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoirs à deux</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2b4c7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devoirs">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f1f3ee;
    --surface: #ffffff;
    --surface-2: #e7eae0;
    --border: #d9ddd0;
    --ink: #1e211c;
    --ink-soft: #5c6156;
    --accent: #2b4c7e;
    --accent-ink: #ffffff;
    --accent-soft: #dde6f2;
    --overdue: #ac333c;
    --overdue-soft: #f7dedc;
    --soon: #a8711b;
    --soon-soft: #f5e7cf;
    --done: #3d7a56;
    --done-soft: #dcebe1;
    --todo: #6b7063;
    --todo-soft: #e7eae0;
    --exam: #6e4b8a;
    --exam-soft: #ece2f4;
    --shadow: 0 1px 2px rgba(30,33,28,0.06), 0 8px 24px -12px rgba(30,33,28,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a;
      --surface: #1d2024;
      --surface-2: #262a2f;
      --border: #34383e;
      --ink: #eceae4;
      --ink-soft: #a3a89e;
      --accent: #86a6d9;
      --accent-ink: #0e1620;
      --accent-soft: #223047;
      --overdue: #e18a8f;
      --overdue-soft: #3a2224;
      --soon: #d9ab5f;
      --soon-soft: #3a2f1c;
      --done: #7fbb98;
      --done-soft: #1f342a;
      --todo: #9ba193;
      --todo-soft: #262a2f;
      --exam: #c9a3e0;
      --exam-soft: #392a47;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #15171a;
    --surface: #1d2024;
    --surface-2: #262a2f;
    --border: #34383e;
    --ink: #eceae4;
    --ink-soft: #a3a89e;
    --accent: #86a6d9;
    --accent-ink: #0e1620;
    --accent-soft: #223047;
    --overdue: #e18a8f;
    --overdue-soft: #3a2224;
    --soon: #d9ab5f;
    --soon-soft: #3a2f1c;
    --done: #7fbb98;
    --done-soft: #1f342a;
    --todo: #9ba193;
    --todo-soft: #262a2f;
    --exam: #c9a3e0;
    --exam-soft: #392a47;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand svg { flex: none; }

  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(22px, 4vw, 28px);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .whoami {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 6px 6px 14px;
    box-shadow: var(--shadow);
    font-size: 13px;
    white-space: nowrap;
  }

  .whoami button {
    border: none;
    background: var(--surface-2);
    color: var(--ink-soft);
    font: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .whoami button:hover { color: var(--ink); }

  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex: none;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }

  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 24px;
    line-height: 1;
  }

  .stat .lbl {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .stat.overdue .num { color: var(--overdue); }
  .stat.done .num { color: var(--done); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
  }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .add-btn {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .add-btn:hover { filter: brightness(1.06); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }

  .panel.open { display: block; }

  .panel h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 14px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }

  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .field input, .field textarea, .field select {
    font: inherit;
    font-size: 14px;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
  }

  .field textarea { resize: vertical; min-height: 60px; }

  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .assign-row { display: flex; flex-wrap: wrap; gap: 6px; }

  .assign-pick {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
  }

  .assign-pick.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .type-row { display: flex; gap: 6px; }

  .type-pick {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
  }

  .type-pick.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .type-pick.active[data-type="examen"] {
    background: var(--exam-soft);
    border-color: var(--exam);
    color: var(--exam);
  }

  .new-course-row {
    display: none;
    gap: 6px;
    margin-top: 6px;
  }

  .new-course-row.show { display: flex; }

  .new-course-row input {
    flex: 1;
    font: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
  }

  .new-course-row button {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    font-size: 12.5px;
    padding: 0 12px;
    border-radius: 8px;
    cursor: pointer;
  }

  .panel-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
  }

  .btn-ghost {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13.5px;
    padding: 8px 14px;
    border-radius: 9px;
    cursor: pointer;
  }

  .btn-solid {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    padding: 8px 16px;
    border-radius: 9px;
    cursor: pointer;
  }

  .btn-solid:disabled { opacity: 0.6; cursor: default; }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--todo);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: rise .35s ease both;
  }

  .card.overdue { border-left-color: var(--overdue); }
  .card.soon { border-left-color: var(--soon); }
  .card.fini { border-left-color: var(--done); opacity: 0.72; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .card-main { flex: 1; min-width: 0; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .subject-tag {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 6px;
  }

  .exam-tag {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--exam);
    background: var(--exam-soft);
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .due-badge {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--todo-soft);
    color: var(--todo);
  }

  .due-badge.overdue { background: var(--overdue-soft); color: var(--overdue); }
  .due-badge.soon { background: var(--soon-soft); color: var(--soon); }

  .card-title {
    font-weight: 600;
    font-size: 15.5px;
    margin: 0 0 2px;
  }

  .card.fini .card-title { text-decoration: line-through; text-decoration-color: var(--ink-soft); }

  .card-desc {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .card-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex: none;
  }

  .card-actions { display: flex; gap: 4px; }

  .icon-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger.confirm { background: var(--overdue-soft); color: var(--overdue); }

  select.status-select {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    padding: 4px 8px;
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
  }

  .empty .big { font-size: 34px; margin-bottom: 8px; }
  .empty p { margin: 4px 0; font-size: 14px; }

  .done-toggle {
    text-align: center;
    margin-top: 6px;
  }

  .done-toggle button {
    border: none;
    background: none;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .banner {
    background: var(--soon-soft);
    color: var(--soon);
    border: 1px solid var(--soon);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12.5px;
    margin-bottom: 16px;
    display: none;
  }

  .banner.show { display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,22,18,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }

  .overlay.hidden { display: none; }

  .overlay-card {
    background: var(--surface);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 28px 26px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }

  .overlay-card h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 6px;
  }

  .overlay-card p {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 0 0 18px;
  }

  .overlay-card input {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 10px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    margin-bottom: 12px;
    text-align: center;
  }

  .overlay-card button {
    width: 100%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
  }

  @media (max-width: 560px) {
    .field-row { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .card { flex-direction: column; }
    .card-side { flex-direction: row-reverse; align-items: center; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="13" cy="17" r="10" fill="var(--accent-soft)"/>
        <circle cx="21" cy="17" r="10" fill="var(--surface-2)"/>
        <path d="M9 17l3 3 6-7" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div>
        <h1>Devoirs à deux</h1>
        <p>Qui doit faire quoi, et pour quand</p>
      </div>
    </div>
    <div class="whoami">
      <span class="avatar" id="my-avatar">?</span>
      <span id="my-name">—</span>
      <button id="switch-name">changer</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="stats">
    <div class="stat"><div class="num" id="stat-todo">0</div><div class="lbl">à faire / en cours</div></div>
    <div class="stat overdue"><div class="num" id="stat-late">0</div><div class="lbl">en retard</div></div>
    <div class="stat done"><div class="num" id="stat-done">0</div><div class="lbl">terminés</div></div>
  </div>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <button class="add-btn" id="open-add">+ Nouveau devoir</button>
  </div>

  <div class="panel" id="panel">
    <h2 id="panel-title">Nouveau devoir</h2>
    <div class="field-row">
      <div class="field full">
        <label>Type</label>
        <div class="type-row" id="type-row">
          <button type="button" class="type-pick" data-type="devoir">Devoir</button>
          <button type="button" class="type-pick" data-type="examen">Examen</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label for="f-title">Titre</label>
        <input id="f-title" type="text" placeholder="Ex. Dissertation chapitre 3" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-subject">Matière</label>
        <select id="f-subject"></select>
        <div class="new-course-row" id="new-course-row">
          <input type="text" id="new-course-input" placeholder="Nom du nouveau cours" maxlength="40" />
          <button type="button" id="add-course-btn">Ajouter</button>
        </div>
      </div>
      <div class="field">
        <label for="f-date">Date de remise</label>
        <input id="f-date" type="date" />
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label>Assigné à</label>
        <div class="assign-row" id="assign-row"></div>
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" placeholder="Détails, consignes, liens..."></textarea>
      </div>
    </div>
    <div class="panel-actions">
      <button class="btn-ghost" id="cancel-panel">Annuler</button>
      <button class="btn-solid" id="save-panel">Enregistrer</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="done-toggle" id="done-toggle-wrap" style="display:none">
    <button id="done-toggle">Afficher les terminés</button>
  </div>
</div>

<div class="overlay" id="name-overlay">
  <div class="overlay-card">
    <h2>C'est qui, toi ?</h2>
    <p>Pour savoir qui a quoi à faire</p>
    <input id="name-input" type="text" placeholder="Ton prénom" maxlength="24" />
    <button id="name-submit">C'est parti</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCBOTYxfW0x6HyK0YZECwTxUr81oI0YuQ4",
  authDomain: "devoirs-55a7f.firebaseapp.com",
  projectId: "devoirs-55a7f",
  storageBucket: "devoirs-55a7f.firebasestorage.app",
  messagingSenderId: "589504609242",
  appId: "1:589504609242:web:b8fab2fba6eee0e9859ee3"
};
firebase.initializeApp(firebaseConfig);
var col = firebase.firestore().collection('devoirs');
var coursesCol = firebase.firestore().collection('cours');

var items = [];
var courses = [];
var myName = localStorage.getItem('devoirs-name') || '';
var filter = 'tous';
var editingId = null;
var showDone = false;

var STATUS = {
  a_faire: { label: 'À faire' },
  en_cours: { label: 'En cours' },
  fini: { label: 'Fini' }
};

var AVATAR_COLORS = ['#2b4c7e', '#6e4b8a', '#2e7d74', '#a15c34', '#55606b', '#7a4356'];
var NAME_COLORS = { 'Léonie': '#3d7a56', 'Gabriel': '#6e4b8a' };

function avatarColor(name) {
  if (NAME_COLORS[name]) return NAME_COLORS[name];
  var hash = 0;
  for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

function initials(name) {
  return (name || '?').trim().slice(0, 2).toUpperCase();
}

function showBanner(text) {
  var b = document.getElementById('banner');
  b.textContent = text;
  b.classList.add('show');
}

function hideBanner() {
  document.getElementById('banner').classList.remove('show');
}

col.onSnapshot(function (snap) {
  items = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
  hideBanner();
  render();
}, function (err) {
  showBanner("Connexion à la base de données perdue — recharge la page.");
});

coursesCol.onSnapshot(function (snap) {
  courses = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
  if (document.getElementById('panel').classList.contains('open')) renderSubjectSelect();
});

function addDevoir(data) {
  data.createdAt = new Date().toISOString();
  data.createdBy = myName;
  col.add(data).catch(function () {
    showBanner("Échec de l'enregistrement — vérifie ta connexion et réessaie.");
  });
}

function updateDevoir(id, data) {
  data.updatedAt = new Date().toISOString();
  col.doc(id).update(data).catch(function () {
    showBanner("Échec de la mise à jour — vérifie ta connexion et réessaie.");
  });
}

function deleteDevoir(id) {
  col.doc(id).delete().catch(function () {
    showBanner("Échec de la suppression — vérifie ta connexion et réessaie.");
  });
}

function dueInfo(iso) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var d = new Date(iso + 'T00:00:00');
  var diff = Math.round((d - today) / 86400000);
  var text, cls;
  if (diff < 0) { text = 'En retard ' + (-diff) + ' j'; cls = 'overdue'; }
  else if (diff === 0) { text = "Aujourd'hui"; cls = 'soon'; }
  else if (diff === 1) { text = 'Demain'; cls = 'soon'; }
  else if (diff <= 6) { text = 'Dans ' + diff + ' j'; cls = 'soon'; }
  else { text = 'Dans ' + diff + ' j'; cls = ''; }
  var abs = d.toLocaleDateString('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' });
  return { text: text, cls: cls, abs: abs, diff: diff };
}

function knownNames() {
  var set = {};
  if (myName) set[myName] = true;
  items.forEach(function (it) {
    if (it.assignedTo && it.assignedTo !== 'Nous deux') set[it.assignedTo] = true;
  });
  return Object.keys(set);
}

function renderWhoAmI() {
  document.getElementById('my-name').textContent = myName || '—';
  var av = document.getElementById('my-avatar');
  av.textContent = initials(myName);
  av.style.background = avatarColor(myName || '?');
}

function renderStats() {
  var todo = 0, late = 0, done = 0;
  items.forEach(function (it) {
    if (it.status === 'fini') { done++; return; }
    var info = dueInfo(it.dueDate);
    if (info.diff < 0) late++; else todo++;
  });
  document.getElementById('stat-todo').textContent = todo;
  document.getElementById('stat-late').textContent = late;
  document.getElementById('stat-done').textContent = done;
}

function renderChips() {
  var names = knownNames();
  var wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  var all = ['tous'].concat(names);
  if (items.some(function (it) { return it.assignedTo === 'Nous deux'; })) all.push('Nous deux');
  all.forEach(function (name) {
    var btn = document.createElement('button');
    btn.className = 'chip' + (filter === name ? ' active' : '');
    btn.textContent = name === 'tous' ? 'Tous' : name;
    btn.onclick = function () { filter = name; render(); };
    wrap.appendChild(btn);
  });
}

function renderAssignRow() {
  var names = knownNames();
  var wrap = document.getElementById('assign-row');
  var current = wrap.getAttribute('data-value') || myName;
  wrap.innerHTML = '';
  var opts = names.slice();
  if (opts.indexOf(myName) === -1 && myName) opts.unshift(myName);
  opts.push('Nous deux');
  opts.forEach(function (name) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'assign-pick' + (current === name ? ' active' : '');
    btn.textContent = name;
    btn.onclick = function () {
      wrap.setAttribute('data-value', name);
      renderAssignRow();
      renderSubjectSelect();
    };
    wrap.appendChild(btn);
  });
}

function subjectOptionsFor(owner) {
  var set = {};
  courses.forEach(function (c) {
    if (c.owner === owner || c.owner === 'Nous deux') set[c.name] = true;
  });
  items.forEach(function (it) {
    if (it.subject && (it.assignedTo === owner || it.assignedTo === 'Nous deux')) set[it.subject] = true;
  });
  return Object.keys(set).sort();
}

function renderSubjectSelect() {
  var owner = document.getElementById('assign-row').getAttribute('data-value') || myName;
  var sel = document.getElementById('f-subject');
  var current = sel.getAttribute('data-current') || '';
  var options = subjectOptionsFor(owner);
  sel.innerHTML = '';
  var placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = options.length ? 'Choisir un cours' : 'Aucun cours encore';
  sel.appendChild(placeholder);
  options.forEach(function (name) {
    var opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === current) opt.selected = true;
    sel.appendChild(opt);
  });
  var addOpt = document.createElement('option');
  addOpt.value = '__new__';
  addOpt.textContent = '+ Nouveau cours...';
  sel.appendChild(addOpt);
}

function makeCard(it) {
  var card = document.createElement('div');
  var info = dueInfo(it.dueDate);
  var stateCls = it.status === 'fini' ? 'fini' : info.cls;
  card.className = 'card' + (stateCls ? ' ' + stateCls : '');

  var main = document.createElement('div');
  main.className = 'card-main';

  var top = document.createElement('div');
  top.className = 'card-top';
  if (it.type === 'examen') {
    var examTag = document.createElement('span');
    examTag.className = 'exam-tag';
    examTag.textContent = 'Examen';
    top.appendChild(examTag);
  }
  if (it.subject) {
    var tag = document.createElement('span');
    tag.className = 'subject-tag';
    tag.textContent = it.subject;
    top.appendChild(tag);
  }
  var badge = document.createElement('span');
  badge.className = 'due-badge' + (info.cls ? ' ' + info.cls : '');
  badge.textContent = it.status === 'fini' ? info.abs : info.text + ' · ' + info.abs;
  top.appendChild(badge);
  main.appendChild(top);

  var title = document.createElement('p');
  title.className = 'card-title';
  title.textContent = it.title;
  main.appendChild(title);

  if (it.description) {
    var desc = document.createElement('p');
    desc.className = 'card-desc';
    desc.textContent = it.description;
    main.appendChild(desc);
  }

  card.appendChild(main);

  var side = document.createElement('div');
  side.className = 'card-side';

  var av = document.createElement('span');
  av.className = 'avatar';
  av.textContent = initials(it.assignedTo);
  av.style.background = avatarColor(it.assignedTo || '?');
  av.title = it.assignedTo;
  side.appendChild(av);

  var actions = document.createElement('div');
  actions.className = 'card-actions';

  var sel = document.createElement('select');
  sel.className = 'status-select';
  Object.keys(STATUS).forEach(function (key) {
    var opt = document.createElement('option');
    opt.value = key;
    opt.textContent = STATUS[key].label;
    if (it.status === key) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = function () { updateDevoir(it.id, { status: sel.value }); };
  actions.appendChild(sel);

  var editBtn = document.createElement('button');
  editBtn.className = 'icon-btn';
  editBtn.title = 'Modifier';
  editBtn.innerHTML = '&#9998;';
  editBtn.onclick = function () { openPanel(it); };
  actions.appendChild(editBtn);

  var delBtn = document.createElement('button');
  delBtn.className = 'icon-btn danger';
  delBtn.title = 'Supprimer';
  delBtn.innerHTML = '&#10005;';
  var confirming = false;
  delBtn.onclick = function () {
    if (!confirming) {
      confirming = true;
      delBtn.classList.add('confirm');
      delBtn.title = 'Cliquer pour confirmer';
      setTimeout(function () {
        confirming = false;
        delBtn.classList.remove('confirm');
        delBtn.title = 'Supprimer';
      }, 3000);
      return;
    }
    deleteDevoir(it.id);
  };
  actions.appendChild(delBtn);

  side.appendChild(actions);
  card.appendChild(side);
  return card;
}

function render() {
  renderWhoAmI();
  renderStats();
  renderChips();

  var filtered = items.filter(function (it) {
    return filter === 'tous' || it.assignedTo === filter;
  });

  var active = filtered.filter(function (it) { return it.status !== 'fini'; })
    .sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); });
  var done = filtered.filter(function (it) { return it.status === 'fini'; })
    .sort(function (a, b) { return (b.updatedAt || '').localeCompare(a.updatedAt || ''); });

  var list = document.getElementById('list');
  list.innerHTML = '';

  if (active.length === 0 && (done.length === 0 || !showDone)) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div class="big">📓</div>' +
      '<p><strong>Aucun devoir ici pour l\'instant.</strong></p>' +
      '<p>Ajoutez le premier avec le bouton ci-dessus.</p>';
    list.appendChild(empty);
  } else {
    active.forEach(function (it) { list.appendChild(makeCard(it)); });
    if (showDone) done.forEach(function (it) { list.appendChild(makeCard(it)); });
  }

  var toggleWrap = document.getElementById('done-toggle-wrap');
  var toggleBtn = document.getElementById('done-toggle');
  if (done.length > 0) {
    toggleWrap.style.display = 'block';
    toggleBtn.textContent = showDone ? 'Masquer les terminés (' + done.length + ')' : 'Afficher les terminés (' + done.length + ')';
  } else {
    toggleWrap.style.display = 'none';
  }
}

function renderTypeRow() {
  var wrap = document.getElementById('type-row');
  var current = wrap.getAttribute('data-value') || 'devoir';
  var btns = wrap.querySelectorAll('.type-pick');
  btns.forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-type') === current);
  });
}

function openPanel(it) {
  editingId = it ? it.id : null;
  document.getElementById('panel-title').textContent = it ? 'Modifier le devoir' : 'Nouveau devoir';
  document.getElementById('f-title').value = it ? it.title : '';
  document.getElementById('f-date').value = it ? it.dueDate : '';
  document.getElementById('f-desc').value = it ? it.description || '' : '';
  document.getElementById('assign-row').setAttribute('data-value', it ? it.assignedTo : myName);
  document.getElementById('f-subject').setAttribute('data-current', it ? it.subject || '' : '');
  document.getElementById('type-row').setAttribute('data-value', it ? it.type || 'devoir' : 'devoir');
  document.getElementById('new-course-row').classList.remove('show');
  document.getElementById('new-course-input').value = '';
  renderAssignRow();
  renderSubjectSelect();
  renderTypeRow();
  document.getElementById('panel').classList.add('open');
  document.getElementById('f-title').focus();
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  editingId = null;
}

function savePanel() {
  var title = document.getElementById('f-title').value.trim();
  var dueDate = document.getElementById('f-date').value;
  if (!title || !dueDate) {
    document.getElementById('f-title').focus();
    return;
  }
  var data = {
    title: title,
    type: document.getElementById('type-row').getAttribute('data-value') || 'devoir',
    subject: document.getElementById('f-subject').value,
    dueDate: dueDate,
    description: document.getElementById('f-desc').value.trim(),
    assignedTo: document.getElementById('assign-row').getAttribute('data-value') || myName
  };
  if (editingId) {
    updateDevoir(editingId, data);
  } else {
    data.status = 'a_faire';
    addDevoir(data);
  }
  closePanel();
}

document.getElementById('open-add').onclick = function () { openPanel(null); };
document.getElementById('cancel-panel').onclick = closePanel;
document.getElementById('save-panel').onclick = savePanel;

document.querySelectorAll('.type-pick').forEach(function (btn) {
  btn.onclick = function () {
    document.getElementById('type-row').setAttribute('data-value', btn.getAttribute('data-type'));
    renderTypeRow();
  };
});

document.getElementById('f-subject').onchange = function () {
  if (this.value === '__new__') {
    this.value = this.getAttribute('data-current') || '';
    document.getElementById('new-course-row').classList.add('show');
    document.getElementById('new-course-input').focus();
  } else {
    this.setAttribute('data-current', this.value);
  }
};

document.getElementById('add-course-btn').onclick = function () {
  var name = document.getElementById('new-course-input').value.trim();
  if (!name) return;
  var owner = document.getElementById('assign-row').getAttribute('data-value') || myName;
  coursesCol.add({ name: name, owner: owner }).then(function (ref) {
    courses.push({ id: ref.id, name: name, owner: owner });
    document.getElementById('f-subject').setAttribute('data-current', name);
    document.getElementById('new-course-input').value = '';
    document.getElementById('new-course-row').classList.remove('show');
    renderSubjectSelect();
  }).catch(function () {
    showBanner("Échec de l'ajout du cours — vérifie ta connexion et réessaie.");
  });
};

document.getElementById('new-course-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('add-course-btn').click(); }
});
document.getElementById('done-toggle').onclick = function () { showDone = !showDone; render(); };
document.getElementById('switch-name').onclick = function () {
  document.getElementById('name-input').value = myName;
  document.getElementById('name-overlay').classList.remove('hidden');
};

document.getElementById('name-submit').onclick = function () {
  var val = document.getElementById('name-input').value.trim();
  if (!val) return;
  myName = val;
  localStorage.setItem('devoirs-name', myName);
  document.getElementById('name-overlay').classList.add('hidden');
  render();
};

document.getElementById('name-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('name-submit').click();
});

if (myName) {
  document.getElementById('name-overlay').classList.add('hidden');
} else {
  document.getElementById('name-input').focus();
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoirs à deux</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2b4c7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devoirs">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="13" cy="17" r="10" fill="var(--accent-soft)"/>
        <circle cx="21" cy="17" r="10" fill="var(--surface-2)"/>
        <path d="M9 17l3 3 6-7" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div>
        <h1>Devoirs à deux</h1>
        <p>Qui doit faire quoi, et pour quand</p>
      </div>
    </div>
    <div class="whoami">
      <span class="avatar" id="my-avatar">?</span>
      <span id="my-name">—</span>
      <button id="switch-name">changer</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="stats">
    <div class="stat"><div class="num" id="stat-todo">0</div><div class="lbl">à faire / en cours</div></div>
    <div class="stat overdue"><div class="num" id="stat-late">0</div><div class="lbl">en retard</div></div>
    <div class="stat done"><div class="num" id="stat-done">0</div><div class="lbl">terminés</div></div>
  </div>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <button class="add-btn" id="open-add">+ Nouveau devoir</button>
  </div>

  <div class="panel" id="panel">
    <h2 id="panel-title">Nouveau devoir</h2>
    <div class="field-row">
      <div class="field full">
        <label>Type</label>
        <div class="type-row" id="type-row">
          <button type="button" class="type-pick" data-type="devoir">Devoir</button>
          <button type="button" class="type-pick" data-type="examen">Examen</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label for="f-title">Titre</label>
        <input id="f-title" type="text" placeholder="Ex. Dissertation chapitre 3" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-subject">Matière</label>
        <select id="f-subject"></select>
        <div class="new-course-row" id="new-course-row">
          <input type="text" id="new-course-input" placeholder="Nom du nouveau cours" maxlength="40" />
          <button type="button" id="add-course-btn">Ajouter</button>
        </div>
      </div>
      <div class="field">
        <label for="f-date">Date de remise</label>
        <input id="f-date" type="date" />
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label>Assigné à</label>
        <div class="assign-row" id="assign-row"></div>
      </div>
    </div>
    <div class="field-row">
      <div class="field full">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" placeholder="Détails, consignes, liens..."></textarea>
      </div>
    </div>
    <div class="panel-actions">
      <button class="btn-ghost" id="cancel-panel">Annuler</button>
      <button class="btn-solid" id="save-panel">Enregistrer</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="done-toggle" id="done-toggle-wrap" style="display:none">
    <button id="done-toggle">Afficher les terminés</button>
  </div>
</div>

<div class="overlay" id="name-overlay">
  <div class="overlay-card">
    <h2>C'est qui, toi ?</h2>
    <p>Pour savoir qui a quoi à faire</p>
    <input id="name-input" type="text" placeholder="Ton prénom" maxlength="24" />
    <button id="name-submit">C'est parti</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>

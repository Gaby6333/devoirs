<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devoirs à deux</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devoirs">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app"></div>

<div class="toast" id="toast" role="status">
  <span id="toast-text"></span>
  <button id="toast-undo" type="button">Annuler</button>
</div>

<div class="overlay hidden" id="name-overlay">
  <div class="overlay-card">
    <div class="overlay-mark">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="24" height="24" rx="8" stroke="var(--accent)" stroke-width="1"/>
        <path d="M8 13.2l3.2 3.2L18 9" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>Devoirs à deux</span>
    </div>
    <h2>C'est qui, toi&nbsp;?</h2>
    <p>Pour savoir qui a quoi à faire.</p>
    <div class="name-pick-row" id="name-pick-row">
      <button type="button" class="name-pick" data-name="Léonie">Léonie</button>
      <button type="button" class="name-pick" data-name="Gabriel">Gabriel</button>
    </div>
    <form id="login-form" class="field" hidden>
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" autocomplete="current-password">
      <button type="submit" class="btn-solid" style="margin-top:14px">Se connecter</button>
      <p id="login-error" class="hist" style="color:var(--overdue)"></p>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
